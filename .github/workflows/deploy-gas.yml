# main に push されたら、clasp で Google Apps Script（GAS）に反映する。
# 手元の PC には何も入れない。動くのは GitHub のサーバー（Actions）。
name: Deploy to GAS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: リポジトリを取り出す
        uses: actions/checkout@v6

      - name: Node.js を用意する
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: clasp を入れる
        run: npm install -g @google/clasp@3.3.0

      # Secret CLASPRC_JSON（clasp login で作った認証ファイルの中身）を
      # 実行環境のホームに書き戻す。値はログに出さない。
      - name: Google の鍵を復元する
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          if [ -z "$CLASPRC_JSON" ]; then
            echo "::error::Secret CLASPRC_JSON が空です。Settings → Secrets に登録してください"
            exit 1
          fi
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          echo "鍵を復元しました（$(wc -c < "$HOME/.clasprc.json") バイト）"

      - name: 反映するファイルを確認する
        run: clasp status

      - name: GAS に反映する
        run: clasp push -f
