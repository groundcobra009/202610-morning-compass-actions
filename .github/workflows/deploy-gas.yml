# main に push されたら、clasp で Google Apps Script（GAS）に反映する。
# 手元の PC には何も入れない。動くのは GitHub のサーバー（Actions）。
name: Deploy to GAS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: リポジトリを取り出す
        uses: actions/checkout@v6

      - name: Node.js を用意する
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: clasp を入れる
        run: npm install -g @google/clasp@3.3.0

      # Secret CLASPRC_JSON_BASE64（clasp login で作った認証ファイルを base64 にした文字列）を
      # 元のファイルに戻して実行環境のホームに置く。値はログに出さない。
      # 旧方式の Secret CLASPRC_JSON（ファイルの中身そのまま）しか無い場合はそちらを使う。
      - name: Google の鍵を復元する
        env:
          CLASPRC_JSON_BASE64: ${{ secrets.CLASPRC_JSON_BASE64 }}
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          if [ -n "$CLASPRC_JSON_BASE64" ]; then
            printf '%s' "$CLASPRC_JSON_BASE64" | tr -d '\r\n ' | base64 -d > "$HOME/.clasprc.json"
          elif [ -n "$CLASPRC_JSON" ]; then
            printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          else
            echo "::error::Secret CLASPRC_JSON_BASE64 が空です。Settings → Secrets に登録してください"
            exit 1
          fi
          chmod 600 "$HOME/.clasprc.json"
          echo "鍵を復元しました（$(wc -c < "$HOME/.clasprc.json") バイト）"

      - name: 反映するファイルを確認する
        run: clasp status

      - name: GAS に反映する
        run: clasp push -f
